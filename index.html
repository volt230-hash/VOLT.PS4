<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault — PS4 Store</title>
    <style>
        :root {
            --bg-color: #08090a;
            --surface-color: #121418;
            --surface-hover: #1a1d23;
            --text-main: #ffffff;
            --text-muted: #8c929d;
            --border-color: #22262e;
            --accent: #ffffff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* --- ÉCRAN D'ACCUEIL --- */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #050607;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .welcome-logo {
            font-size: 64px;
            font-weight: 900;
            letter-spacing: 16px;
            text-transform: uppercase;
            margin-bottom: 8px;
            text-align: center;
        }

        .welcome-sub {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 40px;
        }

        .enter-btn {
            background-color: #ffffff;
            color: #050607;
            border: none;
            padding: 14px 40px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            transition: transform 0.2s, background-color 0.2s;
        }

        .enter-btn:hover {
            background-color: #d1d5db;
            transform: scale(1.03);
        }

        /* --- APPLICATION PRINCIPALE --- */
        #main-app {
            display: none;
        }

        header {
            padding: 24px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            background-color: rgba(8, 9, 10, 0.85);
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .tabs {
            display: flex;
            gap: 25px;
        }

        .tab-btn {
            background: none;
            border: none;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-muted);
            cursor: pointer;
            padding: 5px 0;
            transition: color 0.2s;
        }

        .tab-btn.active {
            color: var(--text-main);
            border-bottom: 2px solid var(--text-main);
        }

        .section {
            display: none;
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 30px;
        }

        .section.active {
            display: block;
        }

        .hero-banner {
            padding: 30px;
            background: linear-gradient(135deg, var(--surface-color), #0d0f13);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 35px;
        }

        .hero-banner h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 2px;
            margin: 0 0 8px 0;
            text-transform: uppercase;
        }

        .hero-banner p {
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin: 0;
            text-transform: uppercase;
        }

        /* --- GRILLE MODERNE DES JEUX --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 25px;
        }

        .card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.25s ease, border-color 0.25s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: #4b5263;
        }

        .card-img-container {
            width: 100%;
            height: 150px;
            background-color: #0f1115;
            position: relative;
            overflow: hidden;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .card:hover .card-img {
            transform: scale(1.05);
        }

        .card-fallback {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-muted);
            font-weight: 800;
            letter-spacing: 2px;
            font-size: 12px;
            background: linear-gradient(45deg, #121418, #1a1d23);
        }

        .card-content {
            padding: 18px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .badge {
            display: inline-block;
            font-size: 9px;
            font-weight: 800;
            padding: 3px 8px;
            background: #1f242d;
            color: #d1d5db;
            border-radius: 3px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            align-self: flex-start;
        }

        .card h3 {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            margin: 0 0 15px 0;
            color: #e5e7eb;
        }

        .btn {
            display: block;
            background-color: var(--text-main);
            color: var(--bg-color);
            text-align: center;
            padding: 11px;
            text-decoration: none;
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            border: none;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #9ca3af;
        }

        /* --- TÉLÉCHARGEMENTS --- */
        .download-manager {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
        }

        .download-item {
            background: #0b0d10;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .download-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 800;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .download-info {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background-color: #1a1d23;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: #ffffff;
            width: 0%;
            transition: width 0.3s ease;
        }

        /* --- HISTORIQUE --- */
        .history-list {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 14px 10px;
            border-bottom: 1px solid var(--border-color);
            font-size: 12px;
        }

        .history-item:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>

    <!-- ÉCRAN D'ACCUEIL -->
    <div id="welcome-screen">
        <div class="welcome-logo">VAULT</div>
        <div class="welcome-sub">PS4 Jailbreak Environment</div>
        <button class="enter-btn" onclick="enterVault()">ENTRER</button>
    </div>

    <!-- APPLICATION -->
    <div id="main-app">
        <header>
            <div class="logo">VAULT.</div>
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('store', event)">Catalogue</button>
                <button class="tab-btn" onclick="switchTab('downloads', event)">Téléchargements</button>
                <button class="tab-btn" onclick="switchTab('history', event)">Historique</button>
            </div>
        </header>

        <!-- CATALOGUE -->
        <div id="store-section" class="section active">
            <div class="hero-banner">
                <h1>Catalogue de Jeux</h1>
                <p>Bibliothèque interactive synchronisée</p>
            </div>
            <div class="grid" id="games-grid">
                <div style="color: var(--text-muted); font-size: 11px; text-align: center; grid-column: 1/-1; padding: 40px;">Chargement du catalogue...</div>
            </div>
        </div>

        <!-- TÉLÉCHARGEMENTS -->
        <div id="downloads-section" class="section">
            <div class="hero-banner">
                <h1>File d'attente</h1>
                <p>Suivi des transferts actifs</p>
            </div>
            <div class="download-manager" id="downloads-container">
                <div style="color: var(--text-muted); font-size: 11px; text-align: center; padding: 20px;">Aucun téléchargement en cours.</div>
            </div>
        </div>

        <!-- HISTORIQUE -->
        <div id="history-section" class="section">
            <div class="hero-banner">
                <h1>Historique</h1>
                <p>Registre des éléments traités</p>
            </div>
            <div class="history-list" id="history-container">
                <div style="color: var(--text-muted); font-size: 11px; text-align: center; padding: 20px;">Aucun historique enregistré.</div>
            </div>
        </div>
    </div>

    <script>
        function enterVault() {
            const welcome = document.getElementById('welcome-screen');
            welcome.style.opacity = '0';
            welcome.style.visibility = 'hidden';
            setTimeout(() => {
                document.getElementById('main-app').style.display = 'block';
                loadGamesJson();
            }, 400);
        }

        function loadGamesJson() {
            fetch('games.json')
                .then(response => response.json())
                .then(data => {
                    const storeGrid = document.getElementById('games-grid');
                    storeGrid.innerHTML = '';

                    const keys = Object.keys(data);

                    keys.forEach(key => {
                        const imageUrl = data[key];
                        const cardHTML = `
                            <div class="card">
                                <div class="card-img-container">
                                    <img src="${imageUrl}" class="card-img" alt="PS4 Asset" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                                    <div class="card-fallback" style="display:none;">VAULT ASSET</div>
                                </div>
                                <div class="card-content">
                                    <div>
                                        <span class="badge">CUSA : ${key}</span>
                                        <h3>Élément ${key}</h3>
                                    </div>
                                    <button class="btn" onclick="startDownload('${key}', '${imageUrl}')">Télécharger .PKG</button>
                                </div>
                            </div>
                        `;
                        storeGrid.innerHTML += cardHTML;
                    });
                })
                .catch(error => {
                    console.error('Erreur:', error);
                    document.getElementById('games-grid').innerHTML = '<div style="color: #ef4444; text-align: center; grid-column: 1/-1; padding: 40px;">Erreur de lecture du fichier games.json.</div>';
                });
        }

        function switchTab(tabName, event) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

            document.getElementById(tabName + '-section').classList.add('active');
            event.target.classList.add('active');
        }

        function startDownload(itemId, fileUrl) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('downloads-section').classList.add('active');
            
            const downloadTabBtn = document.querySelectorAll('.tab-btn')[1];
            if(downloadTabBtn) downloadTabBtn.classList.add('active');

            const container = document.getElementById('downloads-container');
            if(container.innerHTML.includes('Aucun téléchargement')) {
                container.innerHTML = '';
            }

            const downloadId = 'dl-' + Date.now();
            
            container.innerHTML += `
                <div class="download-item" id="${downloadId}">
                    <div class="download-header">
                        <span>CUSA : ${itemId}</span>
                        <span class="dl-percent">0%</span>
                    </div>
                    <div class="download-info">
                        <span class="dl-speed">Vitesse : 22.1 Mo/s</span>
                        <span class="dl-status">Téléchargement en cours...</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" style="width: 0%;"></div>
                    </div>
                </div>
            `;

            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.floor(Math.random() * 8) + 4;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    
                    const itemElement = document.getElementById(downloadId);
                    if(itemElement) {
                        itemElement.querySelector('.dl-percent').innerText = '100%';
                        itemElement.querySelector('.dl-speed').innerText = 'Terminé';
                        itemElement.querySelector('.dl-status').innerText = 'Prêt pour l\'installation (Package Installer)';
                        itemElement.querySelector('.progress-bar-fill').style.width = '100%';
                    }
                    
                    addToHistory('CUSA : ' + itemId);
                } else {
                    const itemElement = document.getElementById(downloadId);
                    if(itemElement) {
                        const randomSpeed = (Math.random() * 12 + 15).toFixed(1);
                        itemElement.querySelector('.dl-percent').innerText = progress + '%';
                        itemElement.querySelector('.dl-speed').innerText = 'Vitesse : ' + randomSpeed + ' Mo/s';
                        itemElement.querySelector('.progress-bar-fill').style.width = progress + '%';
                    }
                }
            }, 350);
        }

        const historyListArray = [];
        function addToHistory(itemName) {
            const time = new Date().toLocaleTimeString();
            historyListArray.unshift({name: itemName, time: time});
            
            const container = document.getElementById('history-container');
            container.innerHTML = '';
            
            historyListArray.forEach(item => {
                container.innerHTML += `
                    <div class="history-item">
                        <span><strong>${item.name}</strong></span>
                        <span style="color: var(--text-muted);">${item.time}</span>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
