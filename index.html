<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault — PS4 Remote Hub</title>
    <style>
        :root {
            --bg-color: #08090a;
            --surface-color: #121418;
            --surface-hover: #1a1d23;
            --text-main: #ffffff;
            --text-muted: #8c929d;
            --border-color: #22262e;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #050607;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .welcome-logo {
            font-size: 64px;
            font-weight: 900;
            letter-spacing: 16px;
            text-transform: uppercase;
            margin-bottom: 8px;
            text-align: center;
        }

        .welcome-sub {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 40px;
        }

        .enter-btn {
            background-color: #ffffff;
            color: #050607;
            border: none;
            padding: 14px 40px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
        }

        .enter-btn:hover {
            background-color: #d1d5db;
        }

        #main-app {
            display: none;
        }

        header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            background-color: rgba(8, 9, 10, 0.85);
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .config-box {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
            color: var(--text-muted);
        }

        .config-box input {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 11px;
            width: 120px;
        }

        .section {
            display: none;
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 30px;
        }

        .section.active {
            display: block;
        }

        .hero-banner {
            padding: 30px;
            background: linear-gradient(135deg, var(--surface-color), #0d0f13);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 35px;
        }

        .hero-banner h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 2px;
            margin: 0 0 8px 0;
            text-transform: uppercase;
        }

        .hero-banner p {
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin: 0;
            text-transform: uppercase;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 25px;
        }

        .card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-img-container {
            width: 100%;
            height: 150px;
            background-color: #0f1115;
            position: relative;
            overflow: hidden;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-fallback {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-muted);
            font-weight: 800;
            font-size: 12px;
        }

        .card-content {
            padding: 18px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .badge {
            display: inline-block;
            font-size: 9px;
            font-weight: 800;
            padding: 3px 8px;
            background: #1f242d;
            color: #d1d5db;
            border-radius: 3px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .card h3 {
            font-size: 13px;
            font-weight: 700;
            margin: 0 0 15px 0;
            color: #e5e7eb;
        }

        .btn {
            display: block;
            background-color: var(--text-main);
            color: var(--bg-color);
            text-align: center;
            padding: 11px;
            text-decoration: none;
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            border: none;
        }

        .btn:hover {
            background-color: #9ca3af;
        }
    </style>
</head>
<body>

    <div id="welcome-screen">
        <div class="welcome-logo">VAULT</div>
        <div class="welcome-sub">PS4 Remote Installer Hub</div>
        <button class="enter-btn" onclick="enterVault()">ENTRER</button>
    </div>

    <div id="main-app">
        <header>
            <div class="logo">VAULT.</div>
            <div class="config-box">
                <span>IP PS4 :</span>
                <input type="text" id="ps4-ip" placeholder="Ex: 192.168.1.50" value="">
            </div>
        </header>

        <div id="store-section" class="section active">
            <div class="hero-banner">
                <h1>Catalogue de Jeux</h1>
                <p>Cliquez pour envoyer directement à la PS4 via Remote Package Installer</p>
            </div>
            <div class="grid" id="games-grid">
                <div style="color: var(--text-muted); text-align: center; grid-column: 1/-1; padding: 40px;">Chargement...</div>
            </div>
        </div>
    </div>

    <script>
        function enterVault() {
            document.getElementById('welcome-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('welcome-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'block';
                loadGamesJson();
            }, 400);
        }

        function loadGamesJson() {
            fetch('games.json')
                .then(response => response.json())
                .then(data => {
                    const storeGrid = document.getElementById('games-grid');
                    storeGrid.innerHTML = '';
                    Object.keys(data).forEach(key => {
                        const fileUrl = data[key];
                        storeGrid.innerHTML += `
                            <div class="card">
                                <div class="card-img-container">
                                    <img src="${fileUrl}" class="card-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                                    <div class="card-fallback" style="display:none;">VAULT ASSET</div>
                                </div>
                                <div class="card-content">
                                    <div>
                                        <span class="badge">CUSA : ${key}</span>
                                        <h3>Élément ${key}</h3>
                                    </div>
                                    <button class="btn" onclick="sendToPS4('${fileUrl}')">Installer sur PS4</button>
                                </div>
                            </div>
                        `;
                    });
                });
        }

        // Fonction pour envoyer l'ordre d'installation à la PS4 (Port standard GoldHEN: 12800)
        function sendToPS4(pkgUrl) {
            const ip = document.getElementById('ps4-ip').value.trim();
            if (!ip) {
                alert("Veuillez entrer l'adresse IP de votre PS4 en haut de la page !");
                return;
            }

            // Structure de la requête au service Remote Package Installer de la PS4
            const targetApi = `http://${ip}:12800/api/install`;
            const payload = JSON.stringify({
                type: "direct",
                objects: [{ package_url: pkgUrl }]
            });

            fetch(targetApi, {
                method: 'POST',
                body: payload
            })
            .then(response => {
                if(response.ok) {
                    alert("Succès ! Le paquet a été envoyé à la PS4. Vérifiez vos notifications sur la console.");
                } else {
                    alert("Erreur de communication avec la PS4. Vérifiez l'IP et assurez-vous que Remote Package Installer est ouvert.");
                }
            })
            .catch(err => {
                console.error(err);
                alert("Échec de l'envoi (Erreur réseau ou CORS).");
            });
        }
    </script>
</body>
</html>
