<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault — PS4 Remote Hub</title>
    <style>
        :root {
            --bg-color: #08090a;
            --surface-color: #121418;
            --surface-hover: #1a1d23;
            --text-main: #ffffff;
            --text-muted: #8c929d;
            --border-color: #22262e;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #050607;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .welcome-logo {
            font-size: 64px;
            font-weight: 900;
            letter-spacing: 16px;
            text-transform: uppercase;
            margin-bottom: 8px;
            text-align: center;
        }

        .welcome-sub {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 40px;
        }

        .enter-btn {
            background-color: #ffffff;
            color: #050607;
            border: none;
            padding: 14px 40px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
        }

        .enter-btn:hover {
            background-color: #d1d5db;
        }

        #main-app {
            display: none;
        }

        header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            background-color: rgba(8, 9, 10, 0.85);
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .nav-right {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .tab-btn {
            background: none;
            border: none;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-muted);
            cursor: pointer;
            padding: 5px 0;
        }

        .tab-btn.active {
            color: var(--text-main);
            border-bottom: 2px solid var(--text-main);
        }

        .settings-icon-btn {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .settings-icon-btn:hover {
            background: var(--surface-hover);
        }

        .section {
            display: none;
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 30px;
        }

        .section.active {
            display: block;
        }

        .hero-banner {
            padding: 30px;
            background: linear-gradient(135deg, var(--surface-color), #0d0f13);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 35px;
        }

        .hero-banner h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 2px;
            margin: 0 0 8px 0;
            text-transform: uppercase;
        }

        .hero-banner p {
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin: 0;
            text-transform: uppercase;
        }

        /* --- PARAMÈTRES --- */
        .settings-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 30px;
            max-width: 600px;
            margin: 0 auto;
        }

        .setting-group {
            margin-bottom: 25px;
        }

        .setting-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        .setting-group input, .setting-group select {
            width: 100%;
            background: #08090a;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 12px;
            border-radius: 4px;
            font-size: 12px;
            box-sizing: border-box;
        }

        .save-settings-btn {
            background: #ffffff;
            color: #08090a;
            border: none;
            padding: 12px 25px;
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 4px;
            cursor: pointer;
        }

        .save-settings-btn:hover {
            background: #d1d5db;
        }

        /* --- GRILLE --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 25px;
        }

        .card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-img-container {
            width: 100%;
            height: 150px;
            background-color: #0f1115;
            position: relative;
            overflow: hidden;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-fallback {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-muted);
            font-weight: 800;
            font-size: 12px;
        }

        .card-content {
            padding: 18px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .badge {
            display: inline-block;
            font-size: 9px;
            font-weight: 800;
            padding: 3px 8px;
            background: #1f242d;
            color: #d1d5db;
            border-radius: 3px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .card h3 {
            font-size: 13px;
            font-weight: 700;
            margin: 0 0 15px 0;
            color: #e5e7eb;
        }

        .btn {
            display: block;
            background-color: var(--text-main);
            color: var(--bg-color);
            text-align: center;
            padding: 11px;
            text-decoration: none;
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            border: none;
        }

        .btn:hover {
            background-color: #9ca3af;
        }
    </style>
</head>
<body>

    <div id="welcome-screen">
        <div class="welcome-logo">VAULT</div>
        <div class="welcome-sub">PS4 Remote Installer Hub</div>
        <button class="enter-btn" onclick="enterVault()">ENTRER</button>
    </div>

    <div id="main-app">
        <header>
            <div class="logo">VAULT.</div>
            <div class="nav-right">
                <button class="tab-btn active" onclick="switchTab('store', event)">Catalogue</button>
                <button class="tab-btn" onclick="switchTab('settings', event)">Paramètres</button>
            </div>
        </header>

        <!-- CATALOGUE -->
        <div id="store-section" class="section active">
            <div class="hero-banner">
                <h1 id="txt-title">Catalogue de Jeux</h1>
                <p id="txt-subtitle">Cliquez pour envoyer directement à la PS4 via Remote Package Installer</p>
            </div>
            <div class="grid" id="games-grid">
                <div style="color: var(--text-muted); text-align: center; grid-column: 1/-1; padding: 40px;">Chargement...</div>
            </div>
        </div>

        <!-- PARAMÈTRES -->
        <div id="settings-section" class="section">
            <div class="hero-banner">
                <h1>Paramètres</h1>
                <p>Configuration de la liaison PS4 et de la langue</p>
            </div>
            <div class="settings-card">
                <div class="setting-group">
                    <label>Adresse IP de la PS4</label>
                    <input type="text" id="setting-ip" placeholder="Ex: 192.168.1.50">
                </div>
                <div class="setting-group">
                    <label>Langue / Language</label>
                    <select id="setting-lang" onchange="changeLanguage(this.value)">
                        <option value="fr">Français</option>
                        <option value="en">English</option>
                    </select>
                </div>
                <button class="save-settings-btn" onclick="saveSettings()">Enregistrer</button>
            </div>
        </div>
    </div>

    <script>
        // Textes multilingues
        const translations = {
            fr: {
                title: "Catalogue de Jeux",
                subtitle: "Cliquez pour envoyer directement à la PS4 via Remote Package Installer",
                btnInstall: "Installer sur PS4",
                saved: "Paramètres enregistrés avec succès !",
                noIp: "Veuillez configurer l'adresse IP de votre PS4 dans l'onglet Paramètres !"
            },
            en: {
                title: "Game Catalog",
                subtitle: "Click to send directly to PS4 via Remote Package Installer",
                btnInstall: "Install on PS4",
                saved: "Settings saved successfully!",
                noIp: "Please configure your PS4 IP address in the Settings tab!"
            }
        };

        let currentLang = 'fr';

        function enterVault() {
            document.getElementById('welcome-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('welcome-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'block';
                loadSettings();
                loadGamesJson();
            }, 400);
        }

        // Charger les paramètres sauvegardés dans le navigateur
        function loadSettings() {
            const savedIp = localStorage.getItem('ps4_ip');
            const savedLang = localStorage.getItem('ps4_lang') || 'fr';
            
            if (savedIp) {
                document.getElementById('setting-ip').value = savedIp;
            }
            document.getElementById('setting-lang').value = savedLang;
            changeLanguage(savedLang);
        }

        // Sauvegarder les paramètres
        function saveSettings() {
            const ip = document.getElementById('setting-ip').value.trim();
            const lang = document.getElementById('setting-lang').value;

            localStorage.setItem('ps4_ip', ip);
            localStorage.setItem('ps4_lang', lang);
            
            alert(translations[currentLang].saved);
            switchTab('store', { target: document.querySelectorAll('.tab-btn')[0] });
        }

        // Changer la langue de l'interface
        function changeLanguage(lang) {
            currentLang = lang;
            document.getElementById('txt-title').innerText = translations[lang].title;
            document.getElementById('txt-subtitle').innerText = translations[lang].subtitle;
            
            // Recharger la grille pour actualiser les textes des boutons
            if(document.getElementById('games-grid').innerHTML.trim() !== "") {
                loadGamesJson();
            }
        }

        function switchTab(tabName, event) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

            document.getElementById(tabName + '-section').classList.add('active');
            if(event && event.target) {
                event.target.classList.add('active');
            }
        }

        function loadGamesJson() {
            fetch('games.json')
                .then(response => response.json())
                .then(data => {
                    const storeGrid = document.getElementById('games-grid');
                    storeGrid.innerHTML = '';
                    Object.keys(data).forEach(key => {
                        const fileUrl = data[key];
                        const btnText = translations[currentLang].btnInstall;
                        storeGrid.innerHTML += `
                            <div class="card">
                                <div class="card-img-container">
                                    <img src="${fileUrl}" class="card-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                                    <div class="card-fallback" style="display:none;">VAULT ASSET</div>
                                </div>
                                <div class="card-content">
                                    <div>
                                        <span class="badge">CUSA : ${key}</span>
                                        <h3>Élément ${key}</h3>
                                    </div>
                                    <button class="btn" onclick="sendToPS4('${fileUrl}')">${btnText}</button>
                                </div>
                            </div>
                        `;
                    });
                });
        }

        function sendToPS4(pkgUrl) {
            const ip = localStorage.getItem('ps4_ip') || document.getElementById('setting-ip').value.trim();
            if (!ip) {
                alert(translations[currentLang].noIp);
                switchTab('settings', document.querySelectorAll('.tab-btn')[1]);
                return;
            }

            const targetApi = `http://${ip}:12800/api/install`;
            const payload = JSON.stringify({
                type: "direct",
                objects: [{ package_url: pkgUrl }]
            });

            fetch(targetApi, {
                method: 'POST',
                body: payload
            })
            .then(response => {
                if(response.ok) {
                    alert(currentLang === 'fr' ? "Succès ! Paquet envoyé à la PS4." : "Success! Package sent to PS4.");
                } else {
                    alert(currentLang === 'fr' ? "Erreur : Vérifiez l'IP et l'app Remote Package Installer." : "Error: Check IP and Remote Package Installer app.");
                }
            })
            .catch(err => {
                console.error(err);
                alert(currentLang === 'fr' ? "Échec de connexion réseau." : "Network connection failed.");
            });
        }
    </script>
</body>
</html>
