<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault — PS4 Remote Hub</title>
    <style>
        :root {
            --bg-color: #08090a;
            --surface-color: #121418;
            --surface-hover: #1a1d23;
            --text-main: #ffffff;
            --text-muted: #8c929d;
            --border-color: #22262e;
            --progress-bar: #ffffff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* --- ÉCRAN D'ACCUEIL --- */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #050607;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999999;
        }

        .welcome-logo {
            font-size: 64px;
            font-weight: 900;
            letter-spacing: 16px;
            text-transform: uppercase;
            margin-bottom: 8px;
            text-align: center;
        }

        .welcome-sub {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 40px;
        }

        .enter-btn {
            background-color: #ffffff;
            color: #050607;
            border: none;
            padding: 14px 40px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
        }

        .enter-btn:hover {
            background-color: #d1d5db;
        }

        #main-app {
            display: none;
        }

        header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            background-color: rgba(8, 9, 10, 0.9);
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .tabs {
            display: flex;
            gap: 20px;
            overflow-x: auto;
        }

        .tab-btn {
            background: none;
            border: none;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-muted);
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 4px;
            white-space: nowrap;
        }

        .tab-btn.active {
            color: var(--text-main);
            border-bottom: 2px solid var(--text-main);
        }

        .section {
            display: none;
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 30px;
        }

        .section.active {
            display: block;
        }

        .hero-banner {
            padding: 30px;
            background: linear-gradient(135deg, var(--surface-color), #0d0f13);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 35px;
        }

        .hero-banner h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 2px;
            margin: 0 0 8px 0;
            text-transform: uppercase;
        }

        .hero-banner p {
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin: 0;
            text-transform: uppercase;
        }

        /* --- PARAMÈTRES --- */
        .settings-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 30px;
            max-width: 600px;
            margin: 0 auto;
        }

        .setting-group {
            margin-bottom: 25px;
        }

        .setting-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        .setting-group input, .setting-group select {
            width: 100%;
            background: #08090a;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 12px;
            border-radius: 4px;
            font-size: 12px;
            box-sizing: border-box;
        }

        .save-settings-btn {
            background: #ffffff;
            color: #08090a;
            border: none;
            padding: 12px 25px;
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 4px;
            cursor: pointer;
        }

        .save-settings-btn:hover {
            background: #d1d5db;
        }

        /* --- GRILLE DU CATALOGUE --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 25px;
        }

        .card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-img-container {
            width: 100%;
            height: 150px;
            background-color: #0f1115;
            position: relative;
            overflow: hidden;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-fallback {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-muted);
            font-weight: 800;
            font-size: 12px;
        }

        .card-content {
            padding: 18px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .badge {
            display: inline-block;
            font-size: 9px;
            font-weight: 800;
            padding: 3px 8px;
            background: #1f242d;
            color: #d1d5db;
            border-radius: 3px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .card h3 {
            font-size: 13px;
            font-weight: 700;
            margin: 0 0 15px 0;
            color: #e5e7eb;
        }

        .btn {
            display: block;
            background-color: var(--text-main);
            color: var(--bg-color);
            text-align: center;
            padding: 11px;
            text-decoration: none;
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            border: none;
        }

        .btn:hover {
            background-color: #9ca3af;
        }

        /* --- TÉLÉCHARGEMENTS --- */
        .download-manager {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
        }

        .download-item {
            background: #0b0d10;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .download-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 800;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .download-info {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background-color: #1a1d23;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: var(--progress-bar);
            width: 0%;
        }

        /* --- HISTORIQUE --- */
        .history-list {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 14px 10px;
            border-bottom: 1px solid var(--border-color);
            font-size: 12px;
        }

        .history-item:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>

    <!-- ÉCRAN D'ACCUEIL (Disparition directe sans animation complexe) -->
    <div id="welcome-screen">
        <div class="welcome-logo">VAULT</div>
        <div class="welcome-sub">PS4 Remote Installer Hub</div>
        <button class="enter-btn" onclick="enterVault()">ENTRER</button>
    </div>

    <div id="main-app">
        <header>
            <div class="logo">VAULT.</div>
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('store', event)" id="nav-store">Catalogue</button>
                <button class="tab-btn" onclick="switchTab('downloads', event)" id="nav-downloads">Téléchargements</button>
                <button class="tab-btn" onclick="switchTab('history', event)" id="nav-history">Historique</button>
                <button class="tab-btn" onclick="switchTab('settings', event)" id="nav-settings">Paramètres</button>
            </div>
        </header>

        <!-- CATALOGUE -->
        <div id="store-section" class="section active">
            <div class="hero-banner">
                <h1 id="txt-title">Catalogue de Jeux</h1>
                <p id="txt-subtitle">Envoyez vos paquets directement à la PS4 via Remote Package Installer</p>
            </div>
            <div class="grid" id="games-grid">
                <div style="color: var(--text-muted); text-align: center; grid-column: 1/-1; padding: 40px;">Chargement...</div>
            </div>
        </div>

        <!-- TÉLÉCHARGEMENTS -->
        <div id="downloads-section" class="section">
            <div class="hero-banner">
                <h1 id="dl-title">File d'attente</h1>
                <p id="dl-subtitle">Suivi des transferts actifs vers
